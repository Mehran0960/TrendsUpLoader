name: Jina Social Probe

on:
  push:
    paths:
      - ".github/workflows/jina-social-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe Jina Search
        run: |
          python - <<'PY'
          import requests, urllib.parse, re
          qs=[
            'site:instagram.com/p فارسی ایرانی وایرال',
            'site:instagram.com/reel فارسی ایرانی پربازدید',
            'site:tiktok.com/@ فارسی ایرانی وایرال'
          ]
          for q in qs:
            u="https://s.jina.ai/"+urllib.parse.quote(q,safe="")
            try:
              r=requests.get(u,headers={"User-Agent":"Mozilla/5.0","Accept":"text/plain"},timeout=30)
              print("\nQUERY",q,"STATUS",r.status_code,"LEN",len(r.text))
              print(r.text[:12000])
            except Exception as e: print("ERR",type(e).__name__,str(e))
          PY
      - name: Cleanup
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/jina-social-probe.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Jina social probe'
            git fetch origin main
            git rebase origin/main
            git push
          fi
