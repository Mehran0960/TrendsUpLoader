name: Daily Original Trend Video — Private Review Only

on:
  schedule:
    # 06:45 Asia/Tehran. GitHub may delay scheduled starts during busy periods.
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: original-content-private-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout latest trend and review state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Persian Gyro voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-fa-gyro-medium-linux-v1

      - name: Install FFmpeg and fonts
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra
          fi
          ffmpeg -version | head -n 1

      - name: Install original-rendering dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 \
            piper-tts pillow arabic-reshaper python-bidi

      - name: Test trend-to-story selector
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest content_pipeline.test_original_review_queue -v

      - name: Build one trend-inspired original Persian short
        env:
          ORIGINAL_TREND_REVIEW_MODE: "true"
          PIPER_VOICE: "fa_IR-gyro-medium"
        run: python content_pipeline/build.py

      - name: Detect generated video
        id: detect
        if: ${{ always() }}
        run: |
          set -euo pipefail
          video="$(find out -type f -name video.mp4 -print -quit 2>/dev/null || true)"
          if [ -n "$video" ] && [ -s "$video" ]; then
            echo "has_video=true" >> "$GITHUB_OUTPUT"
            echo "A video was generated for the private review gate."
          else
            echo "has_video=false" >> "$GITHUB_OUTPUT"
            echo "No eligible fresh trend/story pair. No video will be sent."
            if [ -f out/skip.json ]; then cat out/skip.json; fi
          fi

      - name: Enforce originality, rights, trend freshness, and duration gates
        if: ${{ success() && steps.detect.outputs.has_video == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          video = next(Path("out").glob("**/video.mp4"), None)
          if video is None or not video.is_file() or video.stat().st_size <= 0:
              raise SystemExit("PRIVATE_REVIEW_GATE_FAILED: missing/empty video")
          meta = json.loads((video.parent / "metadata.json").read_text(encoding="utf-8"))
          rights = json.loads((video.parent / "rights_manifest.json").read_text(encoding="utf-8"))
          trend = meta.get("trend_inspiration") or {}
          checks = {
              "curated_script": meta.get("script_mode") == "curated",
              "trend_inspired_mode": meta.get("selection_mode") == "trend_inspired_curated",
              "story_id_present": bool(meta.get("story_id")),
              "fresh_trend_reference": bool(trend.get("url") and trend.get("signal_id")),
              "trend_demand_threshold": float(trend.get("demand_score") or 0) >= 70,
              "rights_manifest_present": bool(rights),
              "all_media_is_generated_originally": rights.get("media_status") == "original_generated_visuals" and rights.get("assets") == [],
              "assets_cleared": rights.get("assets_cleared") is True,
              "publication_rights_gate": rights.get("automated_publishable") is True,
              "editorial_script_gate": meta.get("script_quality") == "passed",
              "minimum_duration": float(meta.get("duration_seconds") or 0) >= 16,
              "telegram_file_size": video.stat().st_size <= 50 * 1024 * 1024,
          }
          print(json.dumps({"private_review_checks": checks, "title": meta.get("display_title_fa"), "duration": meta.get("duration_seconds")}, ensure_ascii=False))
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("PRIVATE_REVIEW_GATE_FAILED: " + ", ".join(failed))
          PY

      - name: Send to the private Telegram review chat only
        if: ${{ success() && steps.detect.outputs.has_video == 'true' }}
        env:
          TELEGRAM_REVIEW_SEND_ENABLED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/send_review_video.py

      - name: Record delivered review item for deduplication
        if: ${{ success() && steps.detect.outputs.has_video == 'true' && hashFiles('out/**/telegram_review_delivery.json') != '' }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          video = next(Path("out").glob("**/video.mp4"))
          meta = json.loads((video.parent / "metadata.json").read_text(encoding="utf-8"))
          receipt = json.loads((video.parent / "telegram_review_delivery.json").read_text(encoding="utf-8"))
          trend = meta.get("trend_inspiration") or {}
          path = Path("attention_state/original_review_queue_state.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              state = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(state, dict):
                  state = {}
          except Exception:
              state = {}

          story_id = str(meta.get("story_id") or "").strip()
          signal_id = str(trend.get("signal_id") or "").strip()
          if not story_id or not signal_id or receipt.get("public_channel_publish_attempted") is not False:
              raise SystemExit("Refusing to persist an incomplete or non-private delivery receipt.")

          recent_stories = list(dict.fromkeys(
              [str(x) for x in state.get("recent_story_ids", []) if x] + [story_id]
          ))[-6:]
          recent_signals = list(dict.fromkeys(
              [str(x) for x in state.get("recent_signal_ids", []) if x] + [signal_id]
          ))[-100:]
          review = {
              "story_id": story_id,
              "signal_id": signal_id,
              "trend_title": trend.get("title"),
              "trend_category": trend.get("category"),
              "trend_demand_score": trend.get("demand_score"),
              "review_title": meta.get("display_title_fa"),
              "sent_at": receipt.get("sent_at"),
              "telegram_message_id": receipt.get("message_id"),
              "content_key": meta.get("content_key"),
              "public_publishing_attempted": False,
          }
          history = list(state.get("reviews", [])) + [review]
          state.update({
              "version": 1,
              "last_reviewed_at": datetime.now(timezone.utc).isoformat(),
              "recent_story_ids": recent_stories,
              "recent_signal_ids": recent_signals,
              "reviews": history[-100:],
          })
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"review_recorded": True, "story_id": story_id, "signal_id": signal_id, "history_size": len(state["reviews"])}, ensure_ascii=False))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/original_review_queue_state.json
          git commit -m "Record private original-video review delivery"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Private-review deduplication state persisted."
              exit 0
            fi
            echo "Push raced with another commit (attempt $attempt); rebasing on main."
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not persist private-review state after retries."
          exit 1

      - name: Preserve the private-review artifact
        if: ${{ always() && hashFiles('out/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: original-trend-private-review
          path: out/
          if-no-files-found: warn
          retention-days: 7
