name: Manual Video Output Test

on:
  issues:
    types: [opened]

jobs:
  test:
    if: github.event.issue.title == 'MANUAL_VIDEO_OUTPUT_TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight downloader
        run: python -m pip install --disable-pip-version-check requests yt-dlp
      - name: Download and send test video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_URL: https://www.youtube.com/watch?v=XMqKI14h6jo
        run: |
          yt-dlp --no-playlist --no-warnings -f "b[ext=mp4]" -o "test.mp4" "$VIDEO_URL"
          python - <<'PY'
          import os, requests, pathlib
          p=pathlib.Path("test.mp4")
          if not p.exists() or p.stat().st_size < 100000:
              raise SystemExit("Video download failed or file too small")
          with p.open("rb") as f:
              r=requests.post(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendVideo",
                  data={
                      "chat_id":os.environ["TELEGRAM_CHAT_ID"],
                      "caption":"🔥 تست کیفیت — Short کمدی فارسی",
                      "supports_streaming":"true",
                  },
                  files={"video":("quality-test.mp4",f,"video/mp4")},
                  timeout=120,
              )
          d=r.json()
          if not d.get("ok"):
              raise SystemExit(d)
          print("TELEGRAM_MESSAGE_ID", d["result"].get("message_id"))
          print("BYTES", p.stat().st_size)
          PY
