name: Daily Trend Discovery — Text Queue Only

on:
  schedule:
    # 06:45 Asia/Tehran (03:15 UTC); GitHub may delay scheduled starts.
    - cron: "15 3 * * *"
  workflow_dispatch:
  # Temporary one-time validation trigger; removed immediately after the queue run is created.
  push:
    paths:
      - "content_pipeline/test_trend_review_queue.py"

concurrency:
  group: daily-trend-review-text-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out trend radar and review state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test discovery, ranking, age and safety gates
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest content_pipeline.test_trend_review_queue -v

      - name: Build a text-only shortlist from the existing trend radar
        run: python content_pipeline/trend_review_queue.py

      - name: Send shortlist text to the private review chat (optional)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/send_trend_review_queue.py

      - name: Persist deduplication state only after successful private delivery
        if: ${{ success() && hashFiles('out/**/trend_review_delivery.json') != '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          receipt_path = Path("out/trend_review_delivery.json")
          queue_path = Path("out/trend_review_queue.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          if receipt.get("public_publishing_attempted") is not False:
              raise SystemExit("Refusing to persist a receipt that isn't explicitly private-only.")

          path = Path("attention_state/trend_review_queue_state.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              state = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(state, dict):
                  state = {}
          except (OSError, ValueError):
              state = {}

          old_ids = [str(x) for x in state.get("recent_signal_ids", []) if x]
          old_urls = [str(x) for x in state.get("recent_urls", []) if x]
          new_ids = [str(x) for x in receipt.get("signal_ids", []) if x]
          new_urls = [str(x) for x in receipt.get("urls", []) if x]
          recent_ids = list(dict.fromkeys(old_ids + new_ids))[-100:]
          recent_urls = list(dict.fromkeys(old_urls + new_urls))[-100:]
          deliveries = list(state.get("deliveries", []))
          deliveries.append({
              "sent_at": datetime.now(timezone.utc).isoformat(),
              "signal_ids": new_ids,
              "item_count": receipt.get("item_count"),
              "telegram_message_id": receipt.get("message_id"),
              "video_production": False,
              "media_downloaded": False,
              "public_publishing_attempted": False,
          })
          state.update({
              "version": 1,
              "last_delivery_at": datetime.now(timezone.utc).isoformat(),
              "recent_signal_ids": recent_ids,
              "recent_urls": recent_urls,
              "deliveries": deliveries[-100:],
          })
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "deduplication_state_updated": True,
              "remembered_signals": len(recent_ids),
              "video_production": False,
              "public_publishing_attempted": False,
          }, ensure_ascii=False))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/trend_review_queue_state.json
          if git diff --cached --quiet; then
            echo "No new deduplication state."
            exit 0
          fi
          git commit -m "Record privately delivered trend review shortlist"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Trend queue deduplication state persisted."
              exit 0
            fi
            echo "Push raced with another commit (attempt $attempt); rebasing."
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not persist deduplication state after retries."
          exit 1

      - name: Preserve the text-only queue artifact
        if: ${{ always() && hashFiles('out/**/trend_review_queue.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trend-review-text-queue
          path: |
            out/trend_review_queue.json
            out/trend_review_delivery.json
          if-no-files-found: warn
          retention-days: 7
