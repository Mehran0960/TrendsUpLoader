name: Google News Resolve Probe

on:
  push:
    paths:
      - ".github/workflows/google-news-resolve-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve original social URLs
        run: |
          python - <<'PY'
          import requests, urllib.parse, xml.etree.ElementTree as ET, re, html
          q='site:imginn.com/p/ (ایران OR ایرانی OR فارسی) (ویدئو OR ویدیو OR وایرال)'
          u="https://news.google.com/rss/search?q="+urllib.parse.quote_plus(q)+"&hl=fa&gl=IR&ceid=IR:fa"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"fa-IR,fa;q=0.9"},timeout=25)
          root=ET.fromstring(r.content)
          for it in root.findall(".//item")[:3]:
            link=(it.findtext("link") or "").strip()
            title=html.unescape(" ".join((it.findtext("title") or "").split()))
            rr=requests.get(link,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"fa-IR,fa;q=0.9"},timeout=25)
            t=html.unescape(rr.text).replace("\\/","/")
            urls=sorted(set(re.findall(r'https?://(?:www\\.)?(?:imginn\\.com|instagram\\.com)/(?:p|reel)/[A-Za-z0-9_-]+/?',t,re.I)))
            print("TITLE",title)
            print("ORIGINAL_URLS",urls[:20])
            print("URL_CONTEXT", [t[max(0,m.start()-120):m.end()+220] for m in re.finditer(r'(?:imginn\\.com|instagram\\.com)',t,re.I)][:5])
          PY
      - name: Cleanup
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/google-news-resolve-probe.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Google News resolve probe'
            git fetch origin main
            git rebase origin/main
            git push
          fi
