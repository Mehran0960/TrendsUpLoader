name: Telegram Channel Setup Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-channel-setup-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Diagnose private and public Telegram routing without publishing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_AUDIENCE_PUBLISH_ENABLED: ${{ vars.TELEGRAM_AUDIENCE_PUBLISH_ENABLED }}
          TELEGRAM_AUDIENCE_BOT_TOKEN: ${{ secrets.TELEGRAM_AUDIENCE_BOT_TOKEN }}
          TELEGRAM_AUDIENCE_CHAT_ID: ${{ secrets.TELEGRAM_AUDIENCE_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import requests

          def api(token, method, payload=None):
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/{method}",
                  json=payload or {},
                  timeout=15,
              )
              try:
                  result = response.json()
              except ValueError:
                  result = {}
              if not response.ok or not result.get("ok"):
                  code = result.get("error_code", response.status_code)
                  print(f"TELEGRAM_CHECK_FAILED method={method} http={response.status_code} code={code}")
                  return None
              return result["result"]

          env = os.environ
          private_token = env.get("TELEGRAM_BOT_TOKEN", "").strip()
          private_target = env.get("TELEGRAM_CHAT_ID", "").strip()
          separate_public_token = env.get("TELEGRAM_AUDIENCE_BOT_TOKEN", "").strip()
          public_token = separate_public_token or private_token
          public_target = env.get("TELEGRAM_AUDIENCE_CHAT_ID", "").strip()
          publish_enabled = env.get("TELEGRAM_AUDIENCE_PUBLISH_ENABLED", "").strip().lower() == "true"

          for name, present in (
              ("TELEGRAM_BOT_TOKEN", bool(private_token)),
              ("TELEGRAM_CHAT_ID", bool(private_target)),
              ("TELEGRAM_AUDIENCE_BOT_TOKEN", bool(separate_public_token)),
              ("PUBLIC_BOT_TOKEN_SOURCE", "dedicated_audience_bot" if separate_public_token else ("existing_private_bot" if private_token else "missing")),
              ("TELEGRAM_AUDIENCE_CHAT_ID", bool(public_target)),
          ):
              print(f"CONFIG_{name}={'SET' if present else 'MISSING_OR_DISABLED'}")

          policy = json.loads(Path("config/telegram_source_policy.json").read_text(encoding="utf-8"))
          allowed_private = bool(policy.get("allow_all_channels_bot_can_receive")) or bool(
              policy.get("allowed_usernames") or policy.get("allowed_chat_ids")
          )
          public_sources = len(policy.get("authorized_public_repost_usernames") or []) + len(
              policy.get("authorized_public_repost_chat_ids") or []
          )
          print(f"PRIVATE_SOURCE_INTAKE={'OPEN_TO_BOT_RECEIVED_CHANNELS' if allowed_private else 'ALLOWLIST_ONLY'}")
          print(f"AUTHORIZED_PUBLIC_SOURCE_COUNT={public_sources}")

          print("PUBLIC_PUBLISH_ENABLED=" + str(publish_enabled).lower())
          failures = []
          if not publish_enabled:
              failures.append("TELEGRAM_AUDIENCE_PUBLISH_ENABLED is not true")
          if not private_token:
              failures.append("TELEGRAM_BOT_TOKEN missing")
          if not private_target:
              failures.append("TELEGRAM_CHAT_ID missing")
          if private_token and private_target:
              me = api(private_token, "getMe")
              chat = api(private_token, "getChat", {"chat_id": private_target})
              print(f"PRIVATE_BOT_API={'OK' if me else 'FAILED'}")
              print(f"PRIVATE_REVIEW_CHAT={'OK' if chat else 'FAILED'}")
              if not me or not chat:
                  failures.append("private Telegram bot/target check failed")

          if not public_token:
              failures.append("neither private nor dedicated audience bot token is configured")
          if not public_target:
              failures.append("TELEGRAM_AUDIENCE_CHAT_ID missing")
          if not publish_enabled:
              failures.append("TELEGRAM_AUDIENCE_PUBLISH_ENABLED is not true")
          if public_token and public_target:
              me = api(public_token, "getMe")
              chat = api(public_token, "getChat", {"chat_id": public_target})
              print(f"PUBLIC_BOT_API={'OK' if me else 'FAILED'}")
              print(f"PUBLIC_CHANNEL_LOOKUP={'OK' if chat else 'FAILED'}")
              if me and chat:
                  member = api(public_token, "getChatMember", {
                      "chat_id": chat["id"], "user_id": me["id"]
                  })
                  status = (member or {}).get("status")
                  can_post = bool((member or {}).get("can_post_messages")) or status == "creator"
                  print(f"PUBLIC_BOT_CHANNEL_STATUS={status or 'CHECK_FAILED'}")
                  print(f"PUBLIC_BOT_CAN_POST={'true' if can_post else 'false'}")
                  if status not in {"administrator", "creator"} or not can_post:
                      failures.append("public bot is not admin with post permission")
              else:
                  failures.append("public bot/target API check failed")

          if public_sources == 0:
              failures.append("no publicly authorized Telegram sources configured")
          if failures:
              print("DIAGNOSTIC_BLOCKERS:")
              for item in failures:
                  print("- " + item)
              raise SystemExit(1)
          print("TELEGRAM_ROUTING_DIAGNOSTICS_PASSED — no message or video was published.")
          PY
