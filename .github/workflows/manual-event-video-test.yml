name: Manual Event Video Test

on:
  issues:
    types: [opened]

jobs:
  test:
    if: startsWith(github.event.issue.title, 'MANUAL_EVENT_VIDEO_TEST')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fetch eventful clip
        run: |
          curl -L --fail --silent --show-error             -A "Mozilla/5.0"             "https://upload.wikimedia.org/wikipedia/commons/0/07/Cat_Jumpscare.webm"             -o source.webm
          ffmpeg -y -i source.webm             -vf "scale=720:404"             -c:v libx264 -preset veryfast -crf 23             -c:a aac -b:a 96k -movflags +faststart test.mp4
      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -s test.mp4
          python - <<'PY'
          import os, requests, pathlib
          p=pathlib.Path("test.mp4")
          with p.open("rb") as f:
              r=requests.post(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendVideo",
                  data={
                      "chat_id":os.environ["TELEGRAM_CHAT_ID"],
                      "caption":"🔥 تست کیفیت — کلیپ کوتاه اتفاق‌دار (۱۰ ثانیه)",
                      "supports_streaming":"true",
                  },
                  files={"video":("event-test.mp4",f,"video/mp4")},
                  timeout=120,
              )
          d=r.json()
          if not d.get("ok"):
              raise SystemExit(d)
          print("TELEGRAM_MESSAGE_ID", d["result"].get("message_id"))
          print("BYTES", p.stat().st_size)
          PY
