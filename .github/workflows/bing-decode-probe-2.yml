name: Bing Decode Probe 2

on:
  push:
    paths:
      - ".github/workflows/bing-decode-probe-2.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode Bing destination URLs
        run: |
          python - <<'PY'
          import requests,re,html,base64,urllib.parse
          q='site:imginn.com/p/ "تیاناوتیارا قبادیان" "یلدا بهونه‌ست"'
          u='https://www.bing.com/search?count=20&q='+urllib.parse.quote_plus(q)
          t=requests.get(u,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"fa-IR,fa;q=0.9"},timeout=25).text
          vals=re.findall(r'<a[^>]+href=["\']([^"\']+)["\']',t,re.I)
          out=[]
          for v in vals:
            m=re.search(r'(?:^|[?&])u=(a1[^&]+)',html.unescape(v))
            if not m: continue
            tok=m.group(1)[2:]; tok += '='*((-len(tok))%4)
            try: dest=base64.urlsafe_b64decode(tok).decode('utf-8','ignore')
            except Exception: continue
            if 'imginn.com/p/' in dest or 'instagram.com/p/' in dest or 'instagram.com/reel/' in dest:
              out.append(dest)
          print('MATCHED_DESTINATIONS')
          for x in dict.fromkeys(out): print(x)
          print('ALL_HREFS_WITH_IMG', [x for x in vals if 'imginn' in x.lower() or 'instagram' in x.lower()][:20])
          PY
      - name: Cleanup
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/bing-decode-probe-2.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Bing decoder probe 2'
            git fetch origin main
            git rebase origin/main
            git push
          fi
