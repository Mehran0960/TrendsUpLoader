name: One-time cleanup of deprecated video-review artifact (retry)

on:
  push:
    paths:
      - ".github/workflows/cleanup-one-time-review-artifact.yml"

permissions:
  contents: read

jobs:
  delete-artifact:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the out-of-scope artifact from the interrupted workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/delete-artifact-response.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Mehran0960/TrendsUpLoader/actions/artifacts/11770944174")"
          case "$status" in
            204)
              echo "Deprecated video-review artifact deleted."
              ;;
            404)
              echo "Artifact already absent; cleanup complete."
              ;;
            *)
              echo "Artifact cleanup failed with HTTP $status."
              cat /tmp/delete-artifact-response.json
              exit 1
              ;;
          esac
