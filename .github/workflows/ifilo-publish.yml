name: FiLo video publisher

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload one top-ranked eligible video (leave unchecked for a safe form probe)"
        type: boolean
        required: true
        default: false
  schedule:
    # Five low-frequency slots matching the existing Tehran audience windows.
    # Scheduled publishing stays off unless the repository variable is explicitly enabled.
    - cron: "50 8 * * *"
    - cron: "20 14 * * *"
    - cron: "50 15 * * *"
    - cron: "20 17 * * *"
    - cron: "50 18 * * *"
  push:
    paths:
      - "content_pipeline/publish_ifilo.py"
      - "content_pipeline/test_publish_ifilo.py"
      - "content_pipeline/distribution_plan.py"
      - ".github/workflows/ifilo-publish.yml"

concurrency:
  group: ifilo-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regression-tests:
    if: ${{ github.event_name != 'schedule' || vars.IFILO_AUTOPUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install --disable-pip-version-check requests pillow yt-dlp
      - name: Test FiLo metadata and duplicate protection
        run: python -m unittest -v content_pipeline.test_publish_ifilo

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.IFILO_AUTOPUBLISH_ENABLED == 'true') }}
    needs: regression-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IFILO_LOGIN_ID: ${{ secrets.IFILO_LOGIN_ID }}
      IFILO_PASSWORD: ${{ secrets.IFILO_PASSWORD }}
      IFILO_STORAGE_STATE_B64: ${{ secrets.IFILO_STORAGE_STATE_B64 }}
      IFILO_AUTOPUBLISH_ENABLED: ${{ vars.IFILO_AUTOPUBLISH_ENABLED }}
      TZ: Asia/Tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uploader dependencies
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check requests pillow yt-dlp playwright
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m playwright install --with-deps chromium
      - name: Determine safe probe or publish mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          AUTOPUBLISH_ENABLED: ${{ vars.IFILO_AUTOPUBLISH_ENABLED }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$AUTOPUBLISH_ENABLED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PUBLISH" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe upload form without publishing
        if: ${{ steps.mode.outputs.publish != 'true' }}
        run: python content_pipeline/publish_ifilo.py
      - name: Upload one selected video
        if: ${{ steps.mode.outputs.publish == 'true' }}
        run: python content_pipeline/publish_ifilo.py --publish
      - name: Preserve safe form-probe diagnostics
        if: ${{ always() && hashFiles('artifacts/ifilo/upload_form_probe.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ifilo-upload-form-probe
          path: artifacts/ifilo/upload_form_probe.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist FiLo deduplication state
        if: ${{ always() && hashFiles('attention_state/ifilo_upload_state.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          state_tmp="$(mktemp)"
          cp attention_state/ifilo_upload_state.json "$state_tmp"
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p attention_state
            python - "$state_tmp" attention_state/ifilo_upload_state.json <<'PY'
          import json, pathlib, sys
          incoming_path, current_path = map(pathlib.Path, sys.argv[1:])
          def load(path):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}
          incoming, current = load(incoming_path), load(current_path)
          merged = {}
          for row in (current.get("attempts") or []) + (incoming.get("attempts") or []):
              if not isinstance(row, dict):
                  continue
              key = str(row.get("source_key") or row.get("source_url") or "")
              if not key:
                  continue
              old = merged.get(key)
              rank = {"uploaded": 5, "uncertain_after_submit": 4, "pending": 3,
                      "submit_failed_before_click": 2, "download_failed": 1}
              if old is None or rank.get(str(row.get("status")), 0) >= rank.get(str(old.get("status")), 0):
                  merged[key] = row
          payload = {
              "schema_version": 1,
              "updated_at": incoming.get("updated_at") or current.get("updated_at"),
              "attempts": list(merged.values())[-500:],
          }
          current_path.parent.mkdir(parents=True, exist_ok=True)
          current_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            git add attention_state/ifilo_upload_state.json
            if git diff --cached --quiet; then
              pushed=true
              break
            fi
            git commit -m "Persist FiLo upload deduplication state"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep "$attempt"
          done
          rm -f "$state_tmp"
          if [ "$pushed" != "true" ]; then
            echo "Failed to persist FiLo upload state after retries." >&2
            exit 1
          fi
