name: FiLo video publisher

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload one top-ranked eligible video only when rights evidence is present"
        type: boolean
        required: true
        default: false
      test_draft:
        description: "Upload one original synthetic test clip as a private/unpublished draft"
        type: boolean
        required: false
        default: false
      verify_test_draft:
        description: "Read-only verification of a previous uncertain test-draft upload; no upload occurs"
        type: boolean
        required: false
        default: false
      inspect_upload_client:
        description: "Read-only inspect of FiLo's upload-page JavaScript and form wiring; no upload occurs"
        type: boolean
        required: false
        default: false
      publish_review_video:
        description: "Publish one exact, authorized Telegram video publicly after duplicate checks"
        type: boolean
        required: false
        default: false
      review_video_source_url:
        description: "Exact Telegram post URL to publish when publish_review_video is selected"
        type: string
        required: false
        default: "https://t.me/gizmiztel/163845"
  schedule:
    # Highest practical cadence supported by GitHub Actions, offset from minute 0 to reduce schedule contention.
    # Each run checks the shared discovery queue; FiLo publishing is independent of Telegram delivery.
    - cron: "2-57/5 * * * *"
  workflow_run:
    workflows: ["Multi-Platform Social Discovery"]
    types: [completed]
    branches: [main]
  push:
    paths:
      - "content_pipeline/publish_ifilo.py"
      - "content_pipeline/test_publish_ifilo.py"
      - "content_pipeline/distribution_plan.py"
      - "attention_state/social_discovery.json"
      - ".github/workflows/ifilo-publish.yml"

concurrency:
  # Read-only verification gets an independent queue; current uncertain smoke-test state is checked before any further upload.
  group: ifilo-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'FiLo verify draft') && format('verify-{0}', github.run_id) || github.event_name == 'push' && contains(github.event.head_commit.message, 'FiLo inspect upload client') && format('inspect-{0}', github.run_id) || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regression-tests:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_run' && (github.event_name != 'push' || github.event.head_commit.message != 'Update multi-platform social discovery state') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install --disable-pip-version-check requests pillow yt-dlp
      - name: Test FiLo metadata and duplicate protection
        run: python -m unittest -v content_pipeline.test_publish_ifilo

  publish:
    # Push-triggered runs are diagnostics unless a specifically named private draft smoke test is requested.
    # Both draft modes force publication, monetization, redistribution, and download off; they never enable public auto-publishing.
    # FiLo publishes independently: after successful discovery runs, plus every five minutes as a retry/check cadence.
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'push' && github.event.head_commit.message == 'Update multi-platform social discovery state') || needs.regression-tests.result == 'success') && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) }}
    needs: regression-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IFILO_LOGIN_ID: ${{ secrets.IFILO_LOGIN_ID }}
      IFILO_PASSWORD: ${{ secrets.IFILO_PASSWORD }}
      IFILO_STORAGE_STATE_B64: ${{ secrets.IFILO_STORAGE_STATE_B64 }}
      TZ: Asia/Tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Determine safe probe, draft, or publish mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          MANUAL_TEST_DRAFT: ${{ inputs.test_draft }}
          MANUAL_VERIFY_TEST_DRAFT: ${{ inputs.verify_test_draft }}
          MANUAL_INSPECT_UPLOAD_CLIENT: ${{ inputs.inspect_upload_client }}
          MANUAL_PUBLIC_REVIEW_VIDEO: ${{ inputs.publish_review_video }}
          MANUAL_REVIEW_VIDEO_URL: ${{ inputs.review_video_source_url }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "test_draft=false" >> "$GITHUB_OUTPUT"
          echo "review_draft=false" >> "$GITHUB_OUTPUT"
          echo "verify_test_draft=false" >> "$GITHUB_OUTPUT"
          echo "inspect_client=false" >> "$GITHUB_OUTPUT"
          echo "public_review_video=false" >> "$GITHUB_OUTPUT"
          echo "review_video_url=" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_RUN_CONCLUSION" = "success" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [ "$HEAD_COMMIT_MESSAGE" = "Update multi-platform social discovery state" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PUBLISH" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_TEST_DRAFT" = "true" ]; then
            echo "test_draft=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_VERIFY_TEST_DRAFT" = "true" ]; then
            echo "verify_test_draft=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_INSPECT_UPLOAD_CLIENT" = "true" ]; then
            echo "inspect_client=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PUBLIC_REVIEW_VIDEO" = "true" ]; then
            echo "public_review_video=true" >> "$GITHUB_OUTPUT"
            printf 'review_video_url=%s\n' "$MANUAL_REVIEW_VIDEO_URL" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$HEAD_COMMIT_MESSAGE" == *"FiLo publish authorized Telegram video publicly"* ]]; then
            echo "public_review_video=true" >> "$GITHUB_OUTPUT"
            printf 'review_video_url=%s\n' "https://t.me/gizmiztel/163845" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$HEAD_COMMIT_MESSAGE" == *"FiLo upload reviewed Telegram video as unpublished draft"* ]]; then
            echo "review_draft=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$HEAD_COMMIT_MESSAGE" == *"FiLo inspect upload client"* ]]; then
            echo "inspect_client=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$HEAD_COMMIT_MESSAGE" == *"FiLo draft smoke test"* ]]; then
            echo "test_draft=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$HEAD_COMMIT_MESSAGE" == *"FiLo verify draft"* ]]; then
            echo "verify_test_draft=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uploader dependencies
        env:
          NEED_MEDIA_TOOLS: ${{ steps.mode.outputs.publish == 'true' || steps.mode.outputs.test_draft == 'true' || steps.mode.outputs.review_draft == 'true' || steps.mode.outputs.public_review_video == 'true' }}
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check requests pillow yt-dlp playwright
          # Browser-only probes need Chromium, but do not need a full apt dependency sweep.
          python -m playwright install chromium
          if [ "$NEED_MEDIA_TOOLS" = "true" ] && { ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; }; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Probe upload form without publishing
        if: ${{ steps.mode.outputs.publish != 'true' && steps.mode.outputs.test_draft != 'true' && steps.mode.outputs.review_draft != 'true' && steps.mode.outputs.public_review_video != 'true' && steps.mode.outputs.verify_test_draft != 'true' && steps.mode.outputs.inspect_client != 'true' }}
        run: python content_pipeline/publish_ifilo.py
      - name: Inspect FiLo upload client without submitting
        if: ${{ steps.mode.outputs.inspect_client == 'true' }}
        run: python content_pipeline/publish_ifilo.py --inspect-upload-client
      - name: Upload original smoke-test clip as unpublished draft
        if: ${{ steps.mode.outputs.test_draft == 'true' }}
        run: python content_pipeline/publish_ifilo.py --test-draft
      - name: Verify prior test draft without uploading
        if: ${{ steps.mode.outputs.verify_test_draft == 'true' }}
        run: python content_pipeline/publish_ifilo.py --verify-test-draft
      - name: Upload one previously reviewed Telegram video as unpublished draft
        if: ${{ steps.mode.outputs.review_draft == 'true' }}
        env:
          IFILO_REVIEW_DRAFT_SOURCE_URL: https://t.me/gizmiztel/163845
        run: python content_pipeline/publish_ifilo.py --upload-review-draft "$IFILO_REVIEW_DRAFT_SOURCE_URL"
      # One-off exact-source manual upload remains available. Scheduled FiLo publishing uses --publish from the independent queue above.
      - name: Publish one explicitly authorized Telegram video publicly
        if: ${{ steps.mode.outputs.public_review_video == 'true' }}
        env:
          IFILO_PUBLIC_REVIEW_SOURCE_URL: ${{ steps.mode.outputs.review_video_url }}
        run: python content_pipeline/publish_ifilo.py --publish-review-video "$IFILO_PUBLIC_REVIEW_SOURCE_URL"
      - name: Upload one selected video
        if: ${{ steps.mode.outputs.publish == 'true' }}
        run: python content_pipeline/publish_ifilo.py --publish
      - name: Preserve safe form-probe diagnostics
        if: ${{ always() && hashFiles('artifacts/ifilo/upload_form_probe.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ifilo-upload-form-probe
          path: artifacts/ifilo/upload_form_probe.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist FiLo deduplication state
        if: ${{ always() && hashFiles('attention_state/ifilo_upload_state.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          state_tmp="$(mktemp)"
          cp attention_state/ifilo_upload_state.json "$state_tmp"
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p attention_state
            python - "$state_tmp" attention_state/ifilo_upload_state.json <<'PY'
          import json, pathlib, sys
          incoming_path, current_path = map(pathlib.Path, sys.argv[1:])
          def load(path):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}
          incoming, current = load(incoming_path), load(current_path)
          merged = {}
          for row in (current.get("attempts") or []) + (incoming.get("attempts") or []):
              if not isinstance(row, dict):
                  continue
              key = str(row.get("source_key") or row.get("source_url") or "")
              if not key:
                  continue
              old = merged.get(key)
              rank = {"uploaded": 5, "draft_uploaded": 5, "test_draft_unexpected_public_route": 5,
                      "uncertain_after_submit": 4, "test_draft_uncertain": 4, "pending": 3,
                      "submit_failed_before_click": 2, "download_failed": 1}
              if old is None or rank.get(str(row.get("status")), 0) >= rank.get(str(old.get("status")), 0):
                  merged[key] = row
          payload = {
              "schema_version": 1,
              "updated_at": incoming.get("updated_at") or current.get("updated_at"),
              "attempts": list(merged.values())[-500:],
          }
          current_path.parent.mkdir(parents=True, exist_ok=True)
          current_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            git add attention_state/ifilo_upload_state.json
            if git diff --cached --quiet; then
              pushed=true
              break
            fi
            git commit -m "Persist FiLo upload deduplication state"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep "$attempt"
          done
          rm -f "$state_tmp"
          if [ "$pushed" != "true" ]; then
            echo "Failed to persist FiLo upload state after retries." >&2
            exit 1
          fi
