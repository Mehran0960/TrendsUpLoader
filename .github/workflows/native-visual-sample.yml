name: Native Visual Sample

on:
  push:
    paths:
      - ".github/workflows/native-visual-sample.yml"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 vertical sample
        run: |
          curl -L --fail --retry 3 --max-time 60 -o sample.webm "https://upload.wikimedia.org/wikipedia/commons/1/12/MeDha.webm"
          ls -lh sample.webm
      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS --fail --max-time 90             -F chat_id="${TELEGRAM_CHAT_ID}"             -F caption="🎯 نمونه کیفیت بصری — اجرای پرانرژی گروه درامر"             -F supports_streaming=true             -F video=@sample.webm             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo"
      - name: Remove sample workflow
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/native-visual-sample.yml
          git commit -m "Remove native visual sample"
          git push
