name: Viral Hunter Live Check

on:
  push:
    paths:
      - ".github/workflows/viral-hunter-live-check.yml"

permissions:
  contents: write

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start local Cobalt acquisition mesh
        run: |
          docker network create cobalt-net
          docker run -d --init --name yt-session-generator --network cobalt-net \
            ghcr.io/imputnet/yt-session-generator:webserver
          docker run -d --init --name cobalt --network cobalt-net -p 9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            -e YOUTUBE_SESSION_SERVER=http://yt-session-generator:8080/token \
            ghcr.io/imputnet/cobalt:11
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/ >/tmp/cobalt-health.json; then
              cat /tmp/cobalt-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs cobalt || true
          docker logs yt-session-generator || true
          exit 1

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check requests "yt-dlp[default]" numpy opencv-python-headless yt-dlp-ejs
          deno --version
          yt-dlp --version

      - name: Run live viral acquisition test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COBALT_API_URL: http://127.0.0.1:9000
        run: python content_pipeline/iran_video_hunter.py

      - name: Cleanup
        if: ${{ always() }}
        run: |
          docker rm -f cobalt yt-session-generator 2>/dev/null || true
          docker network rm cobalt-net 2>/dev/null || true
