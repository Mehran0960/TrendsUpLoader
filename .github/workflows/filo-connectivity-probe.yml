name: Filo Upload Connectivity Probe

on:
  push:
    paths:
      - "content_pipeline/filo_uploader.py"
      - "content_pipeline/test_filo_uploader.py"
      - ".github/workflows/filo-connectivity-probe.yml"
  workflow_dispatch:

concurrency:
  group: filo-connectivity-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run Filo adapter tests
        run: python -m unittest -v content_pipeline.test_filo_uploader
      - name: Probe Filo without uploading a video
        env:
          FILO_USERNAME: \${{ secrets.FILO_USERNAME }}
          FILO_PASSWORD: \${{ secrets.FILO_PASSWORD }}
          FILO_STORAGE_STATE_BASE64: \${{ secrets.FILO_STORAGE_STATE_BASE64 }}
        run: |
          mkdir -p diagnostics
          python content_pipeline/filo_uploader.py --probe | tee "$RUNNER_TEMP/filo_probe_latest.json"
      - name: Persist sanitized probe report
        if: \${{ always() && hashFiles('content_pipeline/filo_uploader.py') != '' }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/filo_probe_latest.json" ]; then
            echo '{"status":"probe_report_missing"}' > "$RUNNER_TEMP/filo_probe_latest.json"
          fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p diagnostics
            cp "$RUNNER_TEMP/filo_probe_latest.json" diagnostics/filo_probe_latest.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add diagnostics/filo_probe_latest.json
            if git diff --cached --quiet; then
              echo "Probe report is already current."
              exit 0
            fi
            git commit -m "Record latest Filo upload connectivity probe"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying probe report persistence (attempt $attempt)."
          done
          echo "Could not persist Filo probe report after four attempts."
          exit 1
