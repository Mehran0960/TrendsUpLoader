name: Google News Social Probe 2

on:
  push:
    paths:
      - ".github/workflows/google-news-social-probe-2.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect RSS descriptions and redirects
        run: |
          python - <<'PY'
          import requests, urllib.parse, xml.etree.ElementTree as ET, html
          q='site:imginn.com/p/ (ایران OR ایرانی OR فارسی) (لایک OR پربازدید OR وایرال)'
          u="https://news.google.com/rss/search?q="+urllib.parse.quote_plus(q)+"&hl=fa&gl=IR&ceid=IR:fa"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"fa-IR,fa;q=0.9"},timeout=25)
          root=ET.fromstring(r.content)
          for it in root.findall(".//item")[:10]:
            title=html.unescape(" ".join((it.findtext("title") or "").split()))
            link=(it.findtext("link") or "").strip()
            desc=html.unescape(" ".join((it.findtext("description") or "").split()))
            rr=requests.get(link,allow_redirects=True,headers={"User-Agent":"Mozilla/5.0"},timeout=25)
            print("\nTITLE",title)
            print("SOURCE",it.findtext("source"))
            print("DESC",desc[:3000])
            print("REDIRECT_STATUS",rr.status_code,"FINAL",rr.url[:500],"TYPE",rr.headers.get("content-type"))
          PY
      - name: Cleanup
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/google-news-social-probe-2.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Google News RSS detail probe'
            git fetch origin main
            git rebase origin/main
            git push
          fi
