name: Visual Quality Validation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-fa-all-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install piper-tts pillow arabic-reshaper python-bidi
      - name: Build visual test
        env:
          CONTENT_TEST_TITLE: Several vulnerabilities have been discovered in the Linux kernel
          RADAR_URL: https://trend-radar.m-hoseyni-6966.workers.dev/candidates
        run: python content_pipeline/build.py
      - name: Upload visual test
        uses: actions/upload-artifact@v4
        with:
          name: visual-quality-test
          path: out/
          if-no-files-found: error
          retention-days: 7
