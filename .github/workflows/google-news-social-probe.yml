name: Google News Social Probe

on:
  push:
    paths:
      - ".github/workflows/google-news-social-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe Google News RSS
        run: |
          python - <<'PY'
          import requests, urllib.parse, xml.etree.ElementTree as ET, re, html
          qs=[
            'site:imginn.com/p/ (ایران OR ایرانی OR فارسی) (لایک OR پربازدید OR وایرال)',
            'site:imginn.com/p/ (طنز OR خنده OR رقص) (likes OR comments)',
            'site:instagram.com/p/ (ایران OR ایرانی OR فارسی) (ویدئو OR ویدیو)'
          ]
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"fa-IR,fa;q=0.9,en;q=0.7"}
          for q in qs:
            u="https://news.google.com/rss/search?q="+urllib.parse.quote_plus(q)+"&hl=fa&gl=IR&ceid=IR:fa"
            r=requests.get(u,headers=h,timeout=25)
            print("\nQUERY",q,"STATUS",r.status_code,"LEN",len(r.content))
            try:
              root=ET.fromstring(r.content)
              for it in root.findall(".//item")[:20]:
                title=html.unescape(" ".join((it.findtext("title") or "").split()))
                link=(it.findtext("link") or "").strip()
                source=" ".join((it.findtext("source") or "").split())
                print("ITEM",title,"|",source,"|",link)
            except Exception as e: print("XMLERR",type(e).__name__)
          PY
      - name: Cleanup
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/google-news-social-probe.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Google News social probe'
            git fetch origin main
            git rebase origin/main
            git push
          fi
