name: Iran Viral Video Hunter

concurrency:
  group: iran-viral-video-hunter
  cancel-in-progress: true

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "content_pipeline/iran_video_hunter.py"
      - "attention_state/social_discovery.json"
      - ".github/workflows/iran-viral-video-hunter.yml"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start local YouTube PO token provider
        run: |
          docker run -d --init --name bgutil-provider -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping >/tmp/bgutil-health.txt 2>/dev/null; then
              echo "bgutil provider reachable"
              cat /tmp/bgutil-health.txt
              exit 0
            fi
            sleep 1
          done
          docker logs bgutil-provider || true
          exit 1

      - name: Start local Cobalt acquisition mesh
        run: |
          docker network create cobalt-net
          docker run -d --init --name yt-session-generator --network cobalt-net \
            ghcr.io/imputnet/yt-session-generator:webserver
          docker run -d --init --name cobalt --network cobalt-net -p 9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            -e YOUTUBE_SESSION_SERVER=http://yt-session-generator:8080/token \
            ghcr.io/imputnet/cobalt:11
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/ >/tmp/cobalt-health.json; then
              echo "Cobalt ready"
              cat /tmp/cobalt-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Cobalt did not become ready"
          docker logs cobalt || true
          docker logs yt-session-generator || true
          exit 1

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          curl -fsSL https://deno.land/install.sh | sh
          export PATH="$HOME/.deno/bin:$PATH"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check requests pillow numpy opencv-python-headless "yt-dlp[default]" yt-dlp-ejs bgutil-ytdlp-pot-provider parth-dl
          deno --version
          yt-dlp --version
      - name: Verify visual quality engine before hunting
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import json
          import os
          import cv2
          import numpy as np
          from content_pipeline.attention_engine import visual_score

          path = "/tmp/visual-engine-preflight.mp4"
          writer = cv2.VideoWriter(
              path,
              cv2.VideoWriter_fourcc(*"mp4v"),
              24.0,
              (320, 480),
          )
          if not writer.isOpened():
              raise SystemExit("VISUAL_ENGINE_SELF_TEST_FAIL: VideoWriter unavailable")

          for i in range(72):
              frame = np.zeros((480, 320, 3), dtype=np.uint8)
              x = 12 + (i * 4) % 250
              cv2.rectangle(frame, (x, 120), (min(x + 45, 319), 180), (255, 255, 255), -1)
              if 12 <= i <= 17 or 50 <= i <= 54:
                  frame[:] = 255
              writer.write(frame)
          writer.release()

          metrics = visual_score(path)
          required = ("score", "hook_event_score", "hook_first_event_score", "hook_structure_score", "visual_novelty_score")
          if not isinstance(metrics, dict) or any(k not in metrics for k in required):
              raise SystemExit("VISUAL_ENGINE_SELF_TEST_FAIL: required metrics missing")
          if not all(np.isfinite(float(metrics[k])) for k in required):
              raise SystemExit("VISUAL_ENGINE_SELF_TEST_FAIL: non-finite metrics")
          print("VISUAL_ENGINE_SELF_TEST_OK", json.dumps(metrics, sort_keys=True))
          os.unlink(path)
          PY
      - name: Hunt and publish one new viral candidate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COBALT_API_URL: http://127.0.0.1:9000
          BGUTIL_POT_URL: http://127.0.0.1:4416
        run: PYTHONPATH="$GITHUB_WORKSPACE" python content_pipeline/iran_video_hunter.py
      - name: Stop local Cobalt services
        if: ${{ always() }}
        run: |
          docker rm -f bgutil-provider cobalt yt-session-generator 2>/dev/null || true
          docker network rm cobalt-net 2>/dev/null || true

      - name: Persist dedupe state
        if: ${{ always() && hashFiles('attention_state/iran_video_hunter_state.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/iran_video_hunter_state.json
          if git diff --cached --quiet; then
            echo 'No state change.'
            exit 0
          fi
          git commit -m 'Update Iran viral video hunter state'
          git fetch origin main
          git rebase origin/main
          git push
