name: Iran Viral Video Hunter

concurrency:
  group: iran-viral-video-hunter
  cancel-in-progress: true

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "content_pipeline/iran_video_hunter.py"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          python -m pip install --disable-pip-version-check requests yt-dlp numpy opencv-python-headless
      - name: Hunt and publish one new viral candidate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/iran_video_hunter.py
      - name: Persist dedupe state
        if: ${{ always() && hashFiles('attention_state/iran_video_hunter_state.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/iran_video_hunter_state.json
          if git diff --cached --quiet; then
            echo 'No state change.'
            exit 0
          fi
          git commit -m 'Update Iran viral video hunter state'
          git fetch origin main
          git rebase origin/main
          git push
