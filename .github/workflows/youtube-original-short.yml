name: Original Short Export Bundle (No External Relay)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build a rights-gated original short and export a portable distribution bundle"
        required: true
        type: choice
        default: package
        options:
          - package

concurrency:
  group: original-short-export
  cancel-in-progress: false

jobs:
  build-and-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify media tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Cache Persian Gyro voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-fa-gyro-medium-v1

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30             piper-tts pillow arabic-reshaper python-bidi requests

      - name: Build original curated Persian short
        env:
          CONTENT_TEST_TITLE: "AI Demo: One photo becomes video"
          CONTENT_TEST_URL: "https://deepmind.google/technologies/veo/"
          PIPER_VOICE: "fa_IR-gyro-medium"
        run: |
          set -euo pipefail
          python content_pipeline/build.py
          video="$(find out -type f -name video.mp4 -print -quit)"
          test -n "$video"
          test -s "$video"
          ffprobe -v error -show_entries format=duration,size -of json "$video"

      - name: Enforce editorial and rights gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          video = next(Path("out").glob("**/video.mp4"))
          folder = video.parent
          meta = json.loads((folder / "metadata.json").read_text(encoding="utf-8"))
          rights = json.loads((folder / "rights_manifest.json").read_text(encoding="utf-8"))
          if meta.get("script_mode") != "curated":
              raise SystemExit("SCRIPT_ORIGIN_GATE_FAILED")
          if meta.get("quality_gate") != "passed_publish" or meta.get("script_quality") != "passed":
              raise SystemExit("EDITORIAL_QUALITY_GATE_FAILED")
          if not rights.get("automated_publishable") or not rights.get("assets_cleared"):
              raise SystemExit("PUBLICATION_RIGHTS_GATE_FAILED")
          if float(meta.get("duration_seconds") or 0) < 16:
              raise SystemExit("VIDEO_TOO_SHORT")
          print("YOUTUBE_ORIGINAL_RELAY_GATES_OK")
          PY

      - name: Prepare portable MP4 for multi-platform distribution
        run: |
          set -euo pipefail
          src="$(find out -type f -name video.mp4 -print -quit)"
          test -n "$src"
          mkdir -p out/distribution
          ffmpeg -hide_banner -loglevel error -y -i "$src" \
            -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=24,format=yuv420p" \
            -c:v libx264 -preset veryfast -b:v 1800k -maxrate 2000k -bufsize 4000k \
            -c:a aac -b:a 96k -movflags +faststart -fs 42000000 \
            out/distribution/distribution-master.mp4
          size="$(stat -c%s out/distribution/distribution-master.mp4)"
          echo "DISTRIBUTION_MASTER_SIZE_BYTES=$size"
          if [ "$size" -gt 42000000 ]; then
            echo "DISTRIBUTION_FILE_LIMIT_GUARD_FAILED"
            exit 1
          fi

      - name: Build independent destination readiness plan
        run: python content_pipeline/distribution_plan.py

      - name: Upload original short distribution bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: original-short-distribution-bundle
          path: out/
          if-no-files-found: warn
          retention-days: 7
