name: Python Syntax Check

on:
  push:
    paths:
      - "**.py"
      - ".github/workflows/python-syntax-check.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: |
          python -m compileall -q content_pipeline
          echo "PYTHON_SYNTAX_OK"
      - name: Run viral quality gate tests
        run: |
          python -m pip install --disable-pip-version-check requests
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest content_pipeline.test_viral_quality_gates -v
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest content_pipeline.test_publication_rights -v
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest content_pipeline.test_social_discovery -v
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest content_pipeline.test_follower_growth -v
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest content_pipeline.test_notify_discovery_shortlist -v
