name: Multi-Platform Social Discovery
# Smoke-test run trigger requested on 2026-10-11; no runtime behavior change.
# Second manual end-to-end output check requested on 2026-10-11.

concurrency:
  group: social-discovery
  cancel-in-progress: false

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "content_pipeline/social_discovery.py"
      - "content_pipeline/follower_growth.py"
      - "content_pipeline/send_review_videos.py"
      - "content_pipeline/test_send_review_videos.py"
      - "content_pipeline/test_follower_growth.py"
      - "content_pipeline/test_social_discovery.py"
      - ".github/workflows/social-discovery.yml"
      - "config/platform_peak_windows.json"
      - "content_pipeline/peak_window_planner.py"
      - "content_pipeline/test_peak_window_planner.py"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Queue delays can make the event SHA older than the latest persisted
          # dedupe state. Always start from main's newest committed state.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check requests yt-dlp pillow
      - name: Run topic-selection regression tests
        run: python -m unittest -v content_pipeline.test_follower_growth content_pipeline.test_social_discovery content_pipeline.test_send_review_videos content_pipeline.test_peak_window_planner
      - name: Verify frame-analysis tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Plan queue-first preparation before platform windows
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        id: peak_plan
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python content_pipeline/peak_window_planner.py --force
          else
            python content_pipeline/peak_window_planner.py
          fi
      - name: Discover cross-platform viral candidates
        if: ${{ success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.peak_plan.outputs.should_discover == 'true' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # External search quotas are reserved for real discovery runs.
          # A code push runs tests and refreshes public Telegram sources only.
          DISCOVERY_PAID_SEARCH_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          YOUTUBE_API_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python content_pipeline/social_discovery.py
      - name: Download and send video files for private review
        if: ${{ success() && hashFiles('attention_state/social_discovery.json') != '' && steps.peak_plan.outputs.should_discover == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/send_review_videos.py
      - name: Persist discovery state
        if: ${{ always() && hashFiles('attention_state/social_discovery.json') != '' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Preserve outputs from this run, then rebuild the state commit on the
          # latest main rather than rebasing large generated JSON files.
          state_tmp="$(mktemp -d)"
          # Never let an empty/invalid discovery output overwrite the last valid state.
          if python - attention_state/social_discovery.json <<'PY'
          import json, pathlib, sys
          try:
              payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
              valid = isinstance(payload, dict) and isinstance(payload.get("items"), list)
          except Exception:
              valid = False
          raise SystemExit(0 if valid else 1)
          PY
          then
            cp attention_state/social_discovery.json "$state_tmp/social_discovery.json"
          else
            echo "WARNING: invalid discovery state; preserving the last committed version."
          fi
          if [ -f attention_state/social_discovery_notification_state.json ]; then
            cp attention_state/social_discovery_notification_state.json "$state_tmp/social_discovery_notification_state.json"
          fi
          if [ -f attention_state/peak_window_planner_state.json ]; then
            cp attention_state/peak_window_planner_state.json "$state_tmp/peak_window_planner_state.json"
          fi

          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p attention_state
            if [ -f "$state_tmp/social_discovery.json" ]; then
              cp "$state_tmp/social_discovery.json" attention_state/social_discovery.json
            fi
            if [ -f "$state_tmp/peak_window_planner_state.json" ]; then
              cp "$state_tmp/peak_window_planner_state.json" attention_state/peak_window_planner_state.json
            fi

            # Notifications can be delivered before persistence. Union the
            # dedupe IDs with the latest remote state so retries do not resend.
            if [ -f "$state_tmp/social_discovery_notification_state.json" ]; then
              python - "$state_tmp/social_discovery_notification_state.json" attention_state/social_discovery_notification_state.json <<'PY'
          import json, pathlib, sys
          incoming_path, current_path = map(pathlib.Path, sys.argv[1:])
          def load(path):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}
          incoming, current = load(incoming_path), load(current_path)
          merged = dict(current)
          merged.update({k: v for k, v in incoming.items() if k not in {
              "notified_ids", "media_reviewed_ids", "media_reviewed_urls",
              "media_reviewed_fingerprints",
          }})
          for key in ("notified_ids", "media_reviewed_ids", "media_reviewed_urls"):
              merged[key] = list(dict.fromkeys(
                  [str(x) for x in current.get(key, [])] +
                  [str(x) for x in incoming.get(key, [])]
              ))[-1000:]
          fingerprints = {}
          for row in (
              list(current.get("media_reviewed_fingerprints", [])) +
              list(incoming.get("media_reviewed_fingerprints", []))
          ):
              if not isinstance(row, dict):
                  continue
              row_key = str(row.get("sha256") or row.get("url") or "")
              if row_key:
                  fingerprints[row_key] = row
          merged["media_reviewed_fingerprints"] = list(fingerprints.values())[-300:]
          current_path.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            fi

            if [ -f "$state_tmp/social_discovery.json" ]; then
              git add attention_state/social_discovery.json
            fi
            if [ -f attention_state/social_discovery_notification_state.json ]; then
              git add attention_state/social_discovery_notification_state.json
            fi
            if [ -f attention_state/peak_window_planner_state.json ]; then
              git add attention_state/peak_window_planner_state.json
            fi
            if git diff --cached --quiet; then
              echo 'No social discovery state change.'
              exit 0
            fi
            git commit -m "Update multi-platform social discovery state"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "State push raced with another workflow (attempt $attempt); retrying on latest main."
          done
          if [ "$pushed" != "true" ]; then
            echo "Could not persist state after four attempts."
            exit 1
          fi
