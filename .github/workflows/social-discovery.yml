name: Multi-Platform Social Discovery
# Run the queue planner hourly; independently reserve five delivery slots for private review.
# Tehran delivery slots: 12:20, 17:50, 19:20, 20:50, 22:20 (UTC: 08:50, 14:20, 15:50, 17:20, 18:50).
# Search queries rotate hourly across source families; delivery remains separate and private-review-only.

concurrency:
  group: social-discovery
  cancel-in-progress: false

on:
  schedule:
    - cron: "13 * * * *"
    - cron: "50 8 * * *"
    - cron: "20 14 * * *"
    - cron: "50 15 * * *"
    - cron: "20 17 * * *"
    - cron: "50 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - "content_pipeline/social_discovery.py"
      - "content_pipeline/follower_growth.py"
      - "content_pipeline/send_review_videos.py"
      - "content_pipeline/test_send_review_videos.py"
      - "content_pipeline/test_follower_growth.py"
      - "content_pipeline/test_social_discovery.py"
      - ".github/workflows/social-discovery.yml"
      - "config/platform_peak_windows.json"
      - "content_pipeline/peak_window_planner.py"
      - "content_pipeline/test_peak_window_planner.py"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Queue delays can make the event SHA older than the latest persisted
          # dedupe state. Always start from main's newest committed state.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check requests yt-dlp pillow
      - name: Run topic-selection regression tests
        run: python -m unittest -v content_pipeline.test_follower_growth content_pipeline.test_social_discovery content_pipeline.test_send_review_videos content_pipeline.test_peak_window_planner
      - name: Verify frame-analysis tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Plan queue-first preparation before platform windows
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        id: peak_plan
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python content_pipeline/peak_window_planner.py --force
          else
            python content_pipeline/peak_window_planner.py
          fi
      - name: Discover cross-platform viral candidates
        # One explicitly named prime run allows a bounded real scan after a code change;
        # ordinary pushes remain tests-only and never spend discovery quota.
        if: ${{ success() && ((github.event_name == 'push' && contains(github.event.head_commit.message, 'Prime viral discovery run')) || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.peak_plan.outputs.should_discover == 'true')) }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCOVERY_PAID_SEARCH_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Prime viral discovery run')) }}
          YOUTUBE_API_ENABLED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Prime viral discovery run')) }}
        run: python content_pipeline/social_discovery.py
      - name: Determine whether this scheduled run is a delivery slot
        id: send_slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [[ "$EVENT_NAME" = "push" && "${{ github.event.head_commit.message }}" == *"Prime viral discovery run"* ]]; then
            echo "send_due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE_CRON" in
            "50 8 * * *"|"20 14 * * *"|"50 15 * * *"|"20 17 * * *"|"50 18 * * *")
              echo "send_due=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "send_due=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Send one qualified existing video for private review
        # Posting is separate from the hourly discovery check.
        if: ${{ success() && hashFiles('attention_state/social_discovery.json') != '' && (github.event_name == 'workflow_dispatch' || steps.send_slot.outputs.send_due == 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        id: send_review
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rm -f artifacts/ifilo_source_urls.txt "$RUNNER_TEMP/review_sender.log"
          python content_pipeline/send_review_videos.py 2>&1 | tee "$RUNNER_TEMP/review_sender.log"
          python - "$RUNNER_TEMP/review_sender.log" artifacts/ifilo_source_urls.txt "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from urllib.parse import urlparse

          log_path, output_path, github_output = sys.argv[1:]
          urls = []
          seen = set()
          with open(log_path, encoding="utf-8", errors="replace") as source:
              for line in source:
                  if "MEDIA_REVIEW_VIDEO_SENT" not in line:
                      continue
                  start = line.find("{")
                  if start < 0:
                      continue
                  try:
                      payload = json.loads(line[start:])
                  except Exception:
                      continue
                  if payload.get("MEDIA_REVIEW_VIDEO_SENT") is not True:
                      continue
                  raw = str(payload.get("url") or "").strip()
                  parsed = urlparse(raw)
                  host = (parsed.netloc or "").lower().removeprefix("www.")
                  match = re.fullmatch(r"/([A-Za-z0-9_]+)/([0-9]+)/?", parsed.path or "")
                  if host not in {"t.me", "telegram.me"} or not match:
                      print("IFILO_AUTO_SKIP_UNSUPPORTED_SOURCE: only exact public Telegram post URLs are supported by this route.")
                      continue
                  channel, post_id = match.groups()
                  url = f"https://t.me/{channel}/{post_id}"
                  if url not in seen:
                      seen.add(url)
                      urls.append(url)

          with open(output_path, "w", encoding="utf-8") as target:
              target.write("".join(url + "\\n" for url in urls))
          with open(github_output, "a", encoding="utf-8") as output:
              output.write(f"ifilo_source_count={len(urls)}\\n")
          print(f"IFILO_AUTO_QUEUE_FROM_SUCCESSFUL_TELEGRAM_SEND count={len(urls)}")
          PY

      - name: Prepare FiLo browser uploader for the sent Telegram video
        id: ifilo_setup
        if: ${{ success() && steps.send_review.outputs.ifilo_source_count != '' && steps.send_review.outputs.ifilo_source_count != '0' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check requests pillow yt-dlp playwright
          python -m playwright install chromium
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Upload each successfully sent Telegram video to FiLo
        if: ${{ steps.ifilo_setup.outcome == 'success' && steps.send_review.outputs.ifilo_source_count != '' && steps.send_review.outputs.ifilo_source_count != '0' }}
        continue-on-error: true
        env:
          IFILO_LOGIN_ID: ${{ secrets.IFILO_LOGIN_ID }}
          IFILO_PASSWORD: ${{ secrets.IFILO_PASSWORD }}
          IFILO_STORAGE_STATE_B64: ${{ secrets.IFILO_STORAGE_STATE_B64 }}
        run: |
          set -uo pipefail
          if [ -z "${IFILO_STORAGE_STATE_B64:-}" ] && { [ -z "${IFILO_LOGIN_ID:-}" ] || [ -z "${IFILO_PASSWORD:-}" ]; }; then
            echo "IFILO_AUTO_SKIP: FiLo sign-in secrets are not configured; Telegram delivery remains successful."
            exit 0
          fi
          while IFS= read -r source_url; do
            [ -n "$source_url" ] || continue
            echo "IFILO_AUTO_UPLOAD_START source_url=$source_url"
            if python content_pipeline/publish_ifilo.py --publish-review-video "$source_url"; then
              status=0
            else
              status=$?
            fi
            echo "IFILO_AUTO_UPLOAD_FINISHED exit_code=$status source_url=$source_url"
          done < artifacts/ifilo_source_urls.txt
      - name: Persist discovery state
        if: ${{ always() && hashFiles('attention_state/social_discovery.json') != '' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Preserve outputs from this run, then rebuild the state commit on the
          # latest main rather than rebasing large generated JSON files.
          state_tmp="$(mktemp -d)"
          # Never let an empty/invalid discovery output overwrite the last valid state.
          if python - attention_state/social_discovery.json <<'PY'
          import json, pathlib, sys
          try:
              payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
              valid = isinstance(payload, dict) and isinstance(payload.get("items"), list)
          except Exception:
              valid = False
          raise SystemExit(0 if valid else 1)
          PY
          then
            cp attention_state/social_discovery.json "$state_tmp/social_discovery.json"
          else
            echo "WARNING: invalid discovery state; preserving the last committed version."
          fi
          if [ -f attention_state/social_discovery_notification_state.json ]; then
            cp attention_state/social_discovery_notification_state.json "$state_tmp/social_discovery_notification_state.json"
          fi
          if [ -f attention_state/peak_window_planner_state.json ]; then
            cp attention_state/peak_window_planner_state.json "$state_tmp/peak_window_planner_state.json"
          fi
          if [ -f attention_state/ifilo_upload_state.json ]; then
            cp attention_state/ifilo_upload_state.json "$state_tmp/ifilo_upload_state.json"
          fi

          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p attention_state
            if [ -f "$state_tmp/social_discovery.json" ]; then
              cp "$state_tmp/social_discovery.json" attention_state/social_discovery.json
            fi
            if [ -f "$state_tmp/peak_window_planner_state.json" ]; then
              cp "$state_tmp/peak_window_planner_state.json" attention_state/peak_window_planner_state.json
            fi

            # Notifications can be delivered before persistence. Union the
            # dedupe IDs with the latest remote state so retries do not resend.
            if [ -f "$state_tmp/social_discovery_notification_state.json" ]; then
              python - "$state_tmp/social_discovery_notification_state.json" attention_state/social_discovery_notification_state.json <<'PY'
          import json, pathlib, sys
          incoming_path, current_path = map(pathlib.Path, sys.argv[1:])
          def load(path):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}
          incoming, current = load(incoming_path), load(current_path)
          merged = dict(current)
          merged.update({k: v for k, v in incoming.items() if k not in {
              "notified_ids", "media_reviewed_ids", "media_reviewed_urls",
              "media_reviewed_fingerprints",
          }})
          for key in ("notified_ids", "media_reviewed_ids", "media_reviewed_urls"):
              merged[key] = list(dict.fromkeys(
                  [str(x) for x in current.get(key, [])] +
                  [str(x) for x in incoming.get(key, [])]
              ))[-1000:]
          fingerprints = {}
          for row in (
              list(current.get("media_reviewed_fingerprints", [])) +
              list(incoming.get("media_reviewed_fingerprints", []))
          ):
              if not isinstance(row, dict):
                  continue
              row_key = str(row.get("sha256") or row.get("url") or "")
              if row_key:
                  fingerprints[row_key] = row
          merged["media_reviewed_fingerprints"] = list(fingerprints.values())[-300:]
          current_path.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            fi

            if [ -f "$state_tmp/ifilo_upload_state.json" ]; then
              python - "$state_tmp/ifilo_upload_state.json" attention_state/ifilo_upload_state.json <<'PY'
          import json, pathlib, sys
          incoming_path, current_path = map(pathlib.Path, sys.argv[1:])
          def load(path):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except Exception:
                  return {}
          incoming, current = load(incoming_path), load(current_path)
          merged = {}
          rank = {
              "uploaded": 8, "draft_uploaded": 8, "test_draft_unexpected_public_route": 8,
              "uncertain_after_submit": 6, "review_public_uncertain": 6, "test_draft_uncertain": 6,
              "pending": 4, "review_public_rejected": 3, "review_draft_rejected": 3,
              "submit_failed_before_click": 2, "download_failed": 1,
          }
          for row in (current.get("attempts") or []) + (incoming.get("attempts") or []):
              if not isinstance(row, dict):
                  continue
              key = str(row.get("source_key") or row.get("source_url") or "")
              if not key:
                  continue
              old = merged.get(key)
              if old is None or rank.get(str(row.get("status") or ""), 0) >= rank.get(str(old.get("status") or ""), 0):
                  merged.pop(key, None)
                  merged[key] = row
          payload = {
              "schema_version": 1,
              "updated_at": incoming.get("updated_at") or current.get("updated_at"),
              "attempts": list(merged.values())[-500:],
          }
          current_path.parent.mkdir(parents=True, exist_ok=True)
          current_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
              git add attention_state/ifilo_upload_state.json
            fi

            if [ -f "$state_tmp/social_discovery.json" ]; then
              git add attention_state/social_discovery.json
            fi
            if [ -f attention_state/social_discovery_notification_state.json ]; then
              git add attention_state/social_discovery_notification_state.json
            fi
            if [ -f attention_state/peak_window_planner_state.json ]; then
              git add attention_state/peak_window_planner_state.json
            fi
            if git diff --cached --quiet; then
              echo 'No social discovery state change.'
              exit 0
            fi
            git commit -m "Update multi-platform social discovery state"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "State push raced with another workflow (attempt $attempt); retrying on latest main."
          done
          if [ "$pushed" != "true" ]; then
            echo "Could not persist state after four attempts."
            exit 1
          fi
