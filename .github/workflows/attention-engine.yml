name: Native Viral Video Engine

concurrency:
  group: attention-remix
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  # Native-only: no YouTube/TikTok links are sent to viewers.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow arabic-reshaper python-bidi opencv-python-headless numpy requests

      - name: Validate Python syntax
        run: |
          python -m py_compile content_pipeline/attention_engine.py
          python -m py_compile content_pipeline/native_telegram.py

      - name: Run native Telegram video engine
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/native_telegram.py

      - name: Persist native engine state
        if: ${{ always() && hashFiles('attention_state/native_posted.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/native_posted.json attention_state/public_radar.json
          if git diff --cached --quiet; then
            echo 'No native state change.'
          else
            git commit -m 'Record native Telegram video state'
            git push
          fi

      - name: Upload native diagnostics
        if: ${{ always() && hashFiles('out/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-telegram
          path: out/
          if-no-files-found: warn
          retention-days: 7
