name: Global Viral Demand Radar

concurrency:
  group: attention-remix
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  # Discovery only. No external links or videos are published by this workflow.

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install radar dependency
        run: pip install pillow

      - name: Validate radar syntax
        run: python -m py_compile content_pipeline/attention_engine.py

      - name: Run global demand radar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import content_pipeline.attention_engine as engine

          signals=engine.discover_youtube_global_charts(limit_per_bucket=8)
          feed={
              "updated_at":datetime.now(timezone.utc).isoformat(),
              "engine_version":"global_demand_radar_v2",
              "signals":signals[:80],
          }
          Path("attention_state").mkdir(exist_ok=True)
          Path("attention_state/public_radar.json").write_text(
              json.dumps(feed,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print("Global signals:",len(signals))
          print("Top 10:")
          for s in signals[:10]:
              print(
                  round(float(s.get("demand_score") or 0),2),
                  int(s.get("views") or 0),
                  int(s.get("chart_region_count") or 0),
                  s.get("category"),
                  s.get("title")
              )
          PY

      - name: Persist radar feed
        if: ${{ always() && hashFiles('attention_state/public_radar.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/public_radar.json
          if git diff --cached --quiet; then
            echo 'No radar state change.'
            exit 0
          fi
          git commit -m 'Update global viral radar feed'
          git fetch origin main
          git rebase origin/main
          git push

      - name: Upload radar artifact
        if: ${{ always() && hashFiles('attention_state/public_radar.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: global-viral-radar
          path: attention_state/public_radar.json
          retention-days: 7
