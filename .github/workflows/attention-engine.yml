name: Attention Remix Engine

concurrency:
  group: attention-remix
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */8 * * *'
  push:
    paths:
      - ".github/workflows/attention-engine.yml"
      - "content_pipeline/attention_engine.py"
      - "content_pipeline/publish_attention_telegram.py"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore attention source cache
        uses: actions/cache@v4
        with:
          path: attention_sources
          key: attention-sources-v2

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow arabic-reshaper python-bidi

      - name: Build attention remix
        run: python content_pipeline/attention_engine.py

      - name: Publish validated attention video to Telegram
        if: ${{ hashFiles('out/**/video.mp4') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/publish_attention_telegram.py

      - name: Persist published attention experiment state
        if: ${{ success() && hashFiles('out/**/publish.json') != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('attention_state/posted.json')
          p.parent.mkdir(exist_ok=True)
          try:
              data=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              data={'version':1,'keys':[],'experiment_counts':{}}
          keys=[str(x) for x in data.get('keys',[])]
          counts={str(k):int(v) for k,v in (data.get('experiment_counts') or {}).items()}
          for m in Path('out').glob('**/metadata.json'):
              meta=json.loads(m.read_text(encoding='utf-8'))
              key=str(meta.get('combination_key') or '').strip()
              exp=str(meta.get('experiment') or '').strip()
              if key and key not in keys:
                  keys.append(key)
              if exp:
                  counts[exp]=counts.get(exp,0)+1
          p.write_text(json.dumps({'version':1,'keys':keys[-100:],'experiment_counts':counts},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/posted.json
          if git diff --cached --quiet; then
            echo 'No attention state change.'
          else
            git commit -m 'Record attention experiment state'
            git push
          fi

      - name: Upload attention artifact
        uses: actions/upload-artifact@v4
        with:
          name: attention-remix
          path: out/
          if-no-files-found: error
          retention-days: 7