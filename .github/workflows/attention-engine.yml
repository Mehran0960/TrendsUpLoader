name: Viral Radar + Licensed Acquisition Engine

concurrency:
  group: attention-remix
  cancel-in-progress: true

on:
  workflow_dispatch:
  # schedule paused while source-quality/virality model is rebuilt

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set API cache date
        id: date
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Pixabay API cache
        uses: actions/cache@v4
        with:
          path: attention_api_cache
          key: pixabay-api-v1-${{ steps.date.outputs.day }}
      - name: Restore attention source cache
        uses: actions/cache@v4
        with:
          path: attention_sources
          key: attention-sources-v2

      - name: Install FFmpeg and Arabic fonts
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg already available."
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          fc-match "Noto Sans Arabic" >/dev/null 2>&1 || sudo apt-get install -y fonts-noto-core fonts-noto-extra

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow arabic-reshaper python-bidi opencv-python-headless

      - name: Validate Python syntax
        run: python -m py_compile content_pipeline/attention_engine.py content_pipeline/publish_attention_telegram.py
      - name: Build attention remix
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python content_pipeline/attention_engine.py

      - name: Publish validated attention video to Telegram
        id: publish
        if: ${{ hashFiles('out/**/video.mp4') != '' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/publish_attention_telegram.py

      - name: Publish diagnostics
        if: ${{ always() && hashFiles('out/**/publish_error.json') != '' }}
        run: |
          echo "=== PUBLISH ERROR ==="
          cat out/**/publish_error.json

      - name: Persist published attention experiment state
        if: ${{ success() && hashFiles('out/**/publish.json') != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('attention_state/posted.json')
          p.parent.mkdir(exist_ok=True)
          try:
              data=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              data={'version':1,'keys':[],'experiment_counts':{},'runs':[]}
          keys=[str(x) for x in data.get('keys',[])]
          counts={str(k):int(v) for k,v in (data.get('experiment_counts') or {}).items()}
          runs=list(data.get('runs') or [])
          for m in Path('out').glob('**/metadata.json'):
              meta=json.loads(m.read_text(encoding='utf-8'))
              key=str(meta.get('combination_key') or '').strip()
              exp=str(meta.get('experiment') or '').strip()
              if key and key not in keys:
                  keys.append(key)
              if exp:
                  counts[exp]=counts.get(exp,0)+1
              pub_path=m.parent/'publish.json'
              if pub_path.exists():
                  pub=json.loads(pub_path.read_text(encoding='utf-8'))
                  runs.append({'message_id':pub.get('message_id'),'experiment':exp,'categories':pub.get('categories') or [],'member_count':pub.get('member_count'),'published_at':pub.get('published_at'),'combination_key':key})
          p.write_text(json.dumps({'version':1,'keys':keys[-100:],'experiment_counts':counts,'runs':runs[-100:]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/posted.json
          if git diff --cached --quiet; then
            echo 'No attention state change.'
          else
            git commit -m 'Record attention experiment state'
            git push
          fi

      - name: Upload attention artifact
        if: ${{ always() && hashFiles('out/**/video.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attention-remix
          path: out/
          if-no-files-found: warn
          retention-days: 7

      - name: Require successful publish
        if: ${{ always() && hashFiles('out/**/video.mp4') != '' && hashFiles('out/**/publish.json') == '' }}
        run: exit 1
