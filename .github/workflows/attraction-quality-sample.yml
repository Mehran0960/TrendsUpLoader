name: Attraction Quality Sample

on:
  push:
    paths:
      - ".github/workflows/attraction-quality-sample.yml"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check requests pillow numpy opencv-python-headless
      - name: Download, score, send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from content_pipeline.iran_video_hunter import local_download, media_info, content_quality_gate, send_video

          article = "https://nournews.ir/fa/news/350236/%D8%AA%D9%86%DB%8C%D8%B3%D9%88%D8%B1-%D8%B1%D9%88%D8%B3-%D8%AA%D9%88%D9%BE-%D8%B1%D8%A7-%D8%A8%D9%87-%DA%86%D8%B4%D9%85-%D8%AA%D9%85%D8%A7%D8%B4%D8%A7%DA%AF%D8%B1-%DA%A9%D9%88%D8%A8%DB%8C%D8%AF-%D9%88-%D8%A7%D8%AE%D8%B1%D8%A7%D8%AC-%D8%B4%D8%AF-%D9%81%DB%8C%D9%84%D9%85"
          title = "تنیسور روس توپ را به چشم تماشاگر کوبید و اخراج شد"
          item = {"title": title, "description": "ویدئوی لحظه برخورد توپ و واکنش ورزشگاه", "source": "نورنیوز"}
          path = local_download(article)
          if not path:
              raise SystemExit("DIRECT_ACQUISITION_FAILED")
          try:
              mi = media_info(path)
              if not mi:
                  raise SystemExit("MEDIA_PROBE_FAILED")
              score, metrics = content_quality_gate(path, item, mi)
              print("ATTRACTION_SCORE", score)
              print("ATTRACTION_METRICS", json.dumps(metrics, ensure_ascii=False))
              if not metrics.get("passed"):
                  raise SystemExit("ATTRACTION_GATE_FAILED")
              sent = send_video(path, title, "نورنیوز")
              print("TELEGRAM_SENT", sent.get("message_id"))
              print("TELEGRAM_FILE_ID", (sent.get("video") or {}).get("file_id"))
          finally:
              try:
                  os.unlink(path)
              except Exception:
                  pass
          PY
      - name: Remove sample workflow
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/attraction-quality-sample.yml
          git commit -m "Remove one-shot attraction quality sample"
          git push
