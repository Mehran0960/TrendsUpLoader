name: Telegram Native Output Proof

on:
  push:
    paths:
      - ".github/workflows/telegram-output-proof.yml"
      - "content_pipeline/telegram_output_proof.py"

permissions:
  contents: read

jobs:
  output:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://deno.land/install.sh | sh
          export PATH="$HOME/.deno/bin:$PATH"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check "yt-dlp[default]" yt-dlp-ejs requests

      - name: Download and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          python content_pipeline/telegram_output_proof.py
