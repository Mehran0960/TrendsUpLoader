name: Telegram Native Output Proof

concurrency:
  group: telegram-native-output-proof
  cancel-in-progress: true

on:
  push:
    paths:
      - ".github/workflows/telegram-output-proof.yml"
      - "content_pipeline/telegram_output_proof.py"

permissions:
  contents: read

jobs:
  output:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp and Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export PATH="$HOME/.deno/bin:$PATH"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check "yt-dlp[default]" yt-dlp-ejs requests
          deno --version
          yt-dlp --version

      - name: Download and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          python content_pipeline/telegram_output_proof.py
