name: Instagram Dance Real Proof

on:
  push:
    paths:
      - ".github/workflows/instagram-dance-proof.yml"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check requests pillow numpy opencv-python-headless parth-dl
      - name: Acquire and gate real Persian Instagram video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          from content_pipeline.iran_video_hunter import media_info, content_quality_gate, send_video
          url="https://www.instagram.com/p/DduN9nPiP88/"
          out=Path(tempfile.mkdtemp(prefix="ig-dance-proof-"))
          print("REAL_INSTAGRAM_SOURCE",url)
          p=subprocess.run(["parth-dl","--no-banner","-P",str(out),url],capture_output=True,text=True,timeout=100)
          print("PARTH_EXIT",p.returncode)
          print(p.stdout[-4500:])
          print(p.stderr[-1800:])
          videos=sorted(out.glob("*.mp4"),key=lambda x:x.stat().st_size,reverse=True)
          if p.returncode != 0 or not videos:
              raise SystemExit("PARTH_IG_DOWNLOAD_FAILED")
          video=videos[0]
          mi=media_info(str(video))
          print("MEDIA_INFO",json.dumps(mi,ensure_ascii=False))
          item={"title":"آموزش رقص فارسی و ایرانی","source":"Instagram / @dancmanc1",
                "link":url,"description":"ویدئوی رقص فارسی/ایرانی؛ 12,385 لایک و 163 کامنت طبق منبع عمومی.",
                "channel_title":"dancmanc1"}
          attraction,cq=content_quality_gate(str(video),item,mi)
          print("ATTRACTION_METRICS",json.dumps(cq,ensure_ascii=False))
          if not cq.get("passed"):
              raise SystemExit("ATTRACTION_GATE_FAILED")
          sent=send_video(str(video),"🔥 ویدئوی فارسی/ایرانی — Instagram / @dancmanc1","Instagram / @dancmanc1")
          print("TELEGRAM_SENT",sent.get("message_id"))
          PY
      - name: Cleanup
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/instagram-dance-proof.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Instagram dance proof workflow'
            git fetch origin main
            git rebase origin/main
            git push
          fi
