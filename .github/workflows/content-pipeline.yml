name: Audience Content Pipeline (manual; publishing off by default)
# Builds original Persian video content and records independent destination readiness.
# Public Telegram publishing requires BOTH a per-run checkbox and a repository variable.

concurrency:
  group: trend-radar-content
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      upload_to_youtube_private:
        description: "Upload the original video to the connected YouTube channel as PRIVATE only"
        required: true
        type: boolean
        default: false
      publish_to_telegram:
        description: "Publish to the separate audience channel after the content and rights gates pass"
        required: true
        type: boolean
        default: false

jobs:
  build:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore published-topic state
        uses: actions/cache@v4
        with:
          path: content_state
          key: published-topic-state-${{ github.run_id }}
          restore-keys: |
            published-topic-state-

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-fa-gyro-linux-v2

      - name: Cache Argos Persian model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-fa-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts pillow arabic-reshaper python-bidi argostranslate

      - name: Install Argos English to Persian model
        env:
          ARGOS_DEVICE_TYPE: cpu
        run: |
          python - <<'PY'
          import argostranslate.package as package
          packages = list(package.get_installed_packages())
          if not any(x.from_code == "en" and x.to_code == "fa" for x in packages):
              package.update_package_index()
              available = [x for x in package.get_available_packages() if x.from_code == "en" and x.to_code == "fa"]
              if not available:
                  raise SystemExit("Argos en->fa model not found")
              available[0].install()
          print("Argos en->fa model ready")
          PY

      - name: Build automated Persian video
        env:
          RADAR_URL: https://trend-radar.m-hoseyni-6966.workers.dev/candidates
        run: python content_pipeline/build.py

      - name: Build destination-specific distribution plan
        if: ${{ success() && hashFiles('out/**/metadata.json') != '' }}
        run: python content_pipeline/distribution_plan.py

      - name: Validate YouTube private-upload credentials
        if: ${{ inputs.upload_to_youtube_private }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID" || { echo "Missing Actions secret YOUTUBE_CLIENT_ID"; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET" || { echo "Missing Actions secret YOUTUBE_CLIENT_SECRET"; exit 1; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo "Missing Actions secret YOUTUBE_REFRESH_TOKEN"; exit 1; }
      - name: Install YouTube uploader dependency
        if: ${{ inputs.upload_to_youtube_private }}
        run: pip install --disable-pip-version-check google-api-python-client
      - name: Upload original video to YouTube privately
        if: ${{ inputs.upload_to_youtube_private }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python content_pipeline/publish_youtube.py
      - name: Publish to the audience Telegram channel (opt-in)
        if: ${{ inputs.publish_to_telegram && vars.TELEGRAM_AUDIENCE_PUBLISH_ENABLED == 'true' && hashFiles('out/**/video.mp4') != '' }}
        env:
          TELEGRAM_AUDIENCE_BOT_TOKEN: ${{ secrets.TELEGRAM_AUDIENCE_BOT_TOKEN }}
          TELEGRAM_AUDIENCE_CHAT_ID: ${{ vars.TELEGRAM_AUDIENCE_CHAT_ID }}
          TELEGRAM_AUDIENCE_PUBLISH_ENABLED: ${{ vars.TELEGRAM_AUDIENCE_PUBLISH_ENABLED }}
        run: python content_pipeline/publish_telegram.py

      - name: Update published-topic state after destination upload
        if: ${{ always() && (hashFiles('out/**/publish.json') != '' || hashFiles('out/**/youtube_upload.json') != '') }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = Path("content_state")
          state.mkdir(exist_ok=True)
          posted = state / "posted.json"
          try:
              data = json.loads(posted.read_text(encoding="utf-8"))
          except Exception:
              data = {"version": 1, "keys": []}
          keys = set(str(x) for x in data.get("keys", []))
          published_records = list(Path("out").glob("**/publish.json")) + list(Path("out").glob("**/youtube_upload.json"))
          for p in published_records:
              meta_path = p.parent / "metadata.json"
              if meta_path.exists():
                  meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  key = str(meta.get("content_key") or "").strip()
                  if key:
                      keys.add(key)
          posted.write_text(json.dumps({"version": 1, "keys": sorted(keys)[-500:]}, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Published topic state updated")
          PY

      - name: Upload generated content
        if: ${{ always() && hashFiles('out/**/video.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trend-radar-content
          path: out/
          if-no-files-found: error
          retention-days: 7
