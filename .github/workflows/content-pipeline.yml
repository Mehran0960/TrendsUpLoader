name: Zero-Cost Content Pipeline
# V3 validation: sentence-synced captions and topic-aware original visuals
# Telegram publish enabled when repository secrets are configured

concurrency:
  group: trend-radar-content
  cancel-in-progress: false

on:
  push:
    paths:
      - "content_pipeline/**"
      - ".github/workflows/content-pipeline.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-fa-gyro-linux-v2

      - name: Cache Argos Persian model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-fa-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts pillow arabic-reshaper python-bidi argostranslate

      - name: Install Argos English to Persian model
        env:
          ARGOS_DEVICE_TYPE: cpu
        run: |
          python - <<'PY'
          import argostranslate.package as package
          packages = list(package.get_installed_packages())
          if not any(x.from_code == "en" and x.to_code == "fa" for x in packages):
              package.update_package_index()
              available = [x for x in package.get_available_packages() if x.from_code == "en" and x.to_code == "fa"]
              if not available:
                  raise SystemExit("Argos en->fa model not found")
              available[0].install()
          print("Argos en->fa model ready")
          PY

      - name: Build automated Persian video
        env:
          RADAR_URL: https://trend-radar.m-hoseyni-6966.workers.dev/candidates
        run: python content_pipeline/build.py

      - name: Publish to Telegram when configured
        if: ${{ hashFiles('out/**/video.mp4') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/publish_telegram.py

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: trend-radar-content
          path: out/
          if-no-files-found: error
          retention-days: 7
