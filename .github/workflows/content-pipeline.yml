name: Zero-Cost Content Pipeline
# V3 validation: sentence-synced captions and topic-aware original visuals
# Telegram publish enabled when repository secrets are configured

concurrency:
  group: trend-radar-content
  cancel-in-progress: false

on:
  push:
    paths:
      - "content_pipeline/**"
      - ".github/workflows/content-pipeline.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-fa-gyro-linux-v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts pillow arabic-reshaper python-bidi

      - name: Build automated Persian video
        env:
          RADAR_URL: https://trend-radar.m-hoseyni-6966.workers.dev/candidates
        run: python content_pipeline/build.py

      - name: Publish to Telegram when configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content_pipeline/publish_telegram.py

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: trend-radar-content
          path: out/
          if-no-files-found: error
          retention-days: 7
