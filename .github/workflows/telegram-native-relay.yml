name: Telegram Native Source Relay

# Tehran time slots: 12:33, 18:07, 19:37, 21:07, 22:37.
# UTC cron: 09:03, 14:37, 16:07, 17:37, 19:07. Times avoid minute zero to reduce schedule contention.
# Public audience routing still requires an explicit source allowlist and separate credentials.
concurrency:
  group: telegram-native-relay
  cancel-in-progress: false

on:
  schedule:
    - cron: "3 9 * * *"
    - cron: "37 14 * * *"
    - cron: "7 16 * * *"
    - cron: "37 17 * * *"
    - cron: "7 19 * * *"

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relay dependency
        run: pip install requests

      - name: Validate relay syntax
        run: python -m py_compile content_pipeline/telegram_native_relay.py

      - name: Poll source channels and transfer the top eligible existing video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_AUDIENCE_PUBLISH_ENABLED: ${{ vars.TELEGRAM_AUDIENCE_PUBLISH_ENABLED }}
          TELEGRAM_AUDIENCE_BOT_TOKEN: ${{ secrets.TELEGRAM_AUDIENCE_BOT_TOKEN }}
          TELEGRAM_AUDIENCE_CHAT_ID: ${{ secrets.TELEGRAM_AUDIENCE_CHAT_ID }}
        run: python content_pipeline/telegram_native_relay.py

      - name: Persist relay state
        if: ${{ always() && hashFiles('attention_state/telegram_relay_state.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/telegram_relay_state.json
          if git diff --cached --quiet; then
            echo 'No relay state change.'
          else
            git commit -m 'Record Telegram native relay state'
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Notify private Telegram review chat on relay failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              raise SystemExit("Cannot notify: private Telegram credentials are missing.")
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          run_url = "https://github.com/{}/actions/runs/{}".format(
              os.environ.get("GITHUB_REPOSITORY", ""),
              os.environ.get("GITHUB_RUN_ID", ""),
          )
          response = requests.post(
              url,
              json={
                  "chat_id": chat,
                  "text": "⚠️ انتقال زمان‌بندی‌شده ویدئو در TrendsUpLoader شکست خورد.\nگزارش اجرا: " + run_url,
                  "disable_web_page_preview": True,
              },
              timeout=15,
          )
          response.raise_for_status()
          payload = response.json()
          if not payload.get("ok"):
              raise SystemExit("Telegram rejected the failure notification.")
          PY
