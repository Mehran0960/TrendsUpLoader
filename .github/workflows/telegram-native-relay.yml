name: Telegram Native Source Relay

# Fixed daily slots in Tehran time: 08:30, 14:30, 20:30 (UTC cron: 05:00, 11:00, 17:00).
# Scheduled runs only; no push/manual trigger can cause an out-of-window public post.
concurrency:
  group: telegram-native-relay
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 5,11,17 * * *"

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relay dependency
        run: pip install requests

      - name: Validate relay syntax
        run: python -m py_compile content_pipeline/telegram_native_relay.py

      - name: Poll approved source channels and transfer the top eligible existing video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_AUDIENCE_PUBLISH_ENABLED: ${{ vars.TELEGRAM_AUDIENCE_PUBLISH_ENABLED }}
          TELEGRAM_AUDIENCE_BOT_TOKEN: ${{ secrets.TELEGRAM_AUDIENCE_BOT_TOKEN }}
          TELEGRAM_AUDIENCE_CHAT_ID: ${{ secrets.TELEGRAM_AUDIENCE_CHAT_ID }}
        run: python content_pipeline/telegram_native_relay.py

      - name: Persist relay state
        if: ${{ always() && hashFiles('attention_state/telegram_relay_state.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attention_state/telegram_relay_state.json
          if git diff --cached --quiet; then
            echo 'No relay state change.'
          else
            git commit -m 'Record Telegram native relay state'
            git fetch origin main
            git rebase origin/main
            git push
          fi
