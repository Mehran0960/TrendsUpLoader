name: One-time cleanup of out-of-scope private review message

on:
  push:
    paths:
      - ".github/workflows/cleanup-out-of-scope-telegram-message.yml"

permissions:
  contents: read

jobs:
  delete-private-message:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete the one mistakenly generated private review video message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Private Telegram cleanup credentials are unavailable."
            exit 1
          fi
          http_status="$(curl -sS -o /tmp/telegram-delete-response.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteMessage" \
            -H "Content-Type: application/json" \
            --data "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"message_id\":111}")"
          if [ "$http_status" != "200" ]; then
            echo "Telegram deleteMessage endpoint returned HTTP $http_status."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path("/tmp/telegram-delete-response.json").read_text(encoding="utf-8"))
          if response.get("ok") is True and response.get("result") is True:
              print("OUT_OF_SCOPE_PRIVATE_MESSAGE_DELETED")
          else:
              # Avoid logging credentials or the original message.
              print("TELEGRAM_DELETE_NOT_CONFIRMED: " + str(response.get("description") or "unknown response"))
              raise SystemExit(1)
          PY
